<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Syrup glass</title>
<!--
  SYRUP GLASS: the mint's Goldberg as a glass pouch filling with syrup (Oct 14 2026 05:4x WEST). His words: the sphere must read as
  "a glass polyhedron, a pouch, filling with syrup: maple syrup, whiskey, amber drops that ripple on the surface, with caustics and
  pristine liquids, the best shaders in the world", with the rigour of the floating-versus-anchored land. The land is mint-gravity.mjs,
  unchanged; this page only draws it. The mapping: a drop is a purchase. Bronze is a small drop that rolls into its pool and floats as a
  pale film; gold is a heavy drop that sets in the glass as a deep amber well. A held cell is amber, an open cell is clear and the star
  (his X picture, as the lab's stand-in for every face) is seen through it; the amber's depth is the money in the cell. A drop's ripple
  travels through its own pool and stops at the watershed (the seam between two masses). The pouch's level is the land held over the
  land there is: a full pouch is sold out; a drop with no cell hangs at the rim. Growth is the swarm's expansion: the mesh glides
  (mint-sphere.js's morphPlan), the level falls, the wells and the chairs stay, new clear land opens on the seams and the hanging drops
  pour onto it.
  FOUR PASSES, WebGL2 (a lab; the WebGPU port is in LANDING.md):
    (a) the wave: a height field on an equirectangular sphere map, 1024 x 512, RG16F ping-pong (h, h before), the two-tap wave
        equation with taps one physical cell apart (the longitude tap widens by 1/cos lat, so a ripple is round anywhere), walled by a
        pool-id texture (RG16F: pool, face; built on the GPU by the nearest face centre, on a cause only). A drop is a cosine splat at
        its cell's direction. The field integrates only while its energy (a 32 x 16 reduction, read back asynchronously) is above a
        threshold; then it is cleared and the page stops drawing.
    (b) the glass: one draw of the Goldberg mesh (buildAssemblySkin faces, a fan a face, front faces only), Fresnel, a thin shell
        whose outer normal carries the wave's gradient and whose inner normal is the sphere's, so each facet is a faint prism and a
        ripple bends what is seen through it; the star disc at the centre; Beer-Lambert amber by the cell's money through the front
        film, the pool below the level and the far cell's film; the room's reflection and the key light; the meniscus at the level.
    (c) the caustics: the field's Laplacian as light focus, projected onto the parchment under the pouch (the bottom hemisphere seen
        from below), tinted by the cell's amber and the pool's thickness, in the sphere's shadow ellipse. The parchment is a function
        of the pixel, not a texture: the glass and the drops evaluate it where their refraction lands, and a frame repaints only the
        rectangle around the pouch (the canvas keeps its buffer).
    (d) the drops: instanced beads, sphere impostors that refract the backdrop and carry their metal's amber; a drop rolls 400 ms
        from the rim to its cell and splashes as the impulse; one seen through the glass is dimmed.
  THE LAW OF REST: no timer draws, no idle animation; a draw happens on a cause (a drop, a ripple alive, a glide, the level moving,
  a drag, a resize). At rest the page draws nothing; window.__syrup counts frames and draws so a bench can prove it. Still is told by the
  clock (LIFE_MS below, a drop's ripple's measured life; the costliest pass, the energy readback, never runs; ?rest=energy reads the field's
  energy back instead, to measure that life again). FOR THE HERO (Oct 16 2026, the glass on the box with the liquor poured once and no
  drops): no wave, mask or energy pass at all, the field a zero texture, so the glass pass alone draws (its backdrop read once a pixel,
  ?dispersion=0, where the fringe is not worth a third of it); a meniscus ripple, if wanted, is analytic (irradiance.js's wave).
  Not in the build (outside app/, js/, skills/, submission/); worn on no glass. ?bench=1 exposes the seams the bench reads.
  THE TANK (Oct 16 2026; tank-law.mjs holds the law, tank-law.test.mjs holds it to the law, tank.proof.mjs sees it). His words: Sept 7 "money in
  vault / money lands in tank (fuel) / agents are getting paid"; Sept 18 "turn the unit0 of every swarm as the 'tank fuel'"; Sept 21 "every time we
  use tokens i wanna see like in league of legends the DPS or any number flashing to screen showing me how much i spent"; Oct 16, over this glass:
  "focus on what i had for minirouter... the fucking MMO-like when tank-fuel is consumed by calling agents". The pouch is the MiniRouter tank: the
  page reads the Nest's house/purse and mint/drops (tools/embertide-mesh/lib/house-purse.mjs writes the first on a cause: every call through the
  purse door) once at load and then on their stream; the syrup's level is the purse's; a call that drank (a new burn row) flies up from the surface
  as a number (its cost, its lane, its tokens in: the DPS), sparks rise from the surface and it takes a sip; the balance stands under the pouch with
  the burn rate of the last minute; a sale (a drop on mint/drops) falls as a drop of its metal. Nothing at rest: the numbers are CSS animations on
  the compositor, the sparks and the sip are causes of the page's own loop. No purse on the Nest, nothing of it is drawn. ?tank=0 leaves the pouch
  the lab's; in a bench (?bench=1) the tank is off unless ?tank=1, so a bench stays hermetic; ?nest= names the Nest (default: this host, :8904).
-->
<style>
  :root{--paper:#f4f0e7;--ink:#252921;--mute:#6f7466;--line:#d9d3c5}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:13px/1.45 -apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  .panel{position:fixed;left:18px;top:16px;width:300px;z-index:2;background:rgb(250 249 245 / .82);border:1px solid #d6bf8970;padding:12px 14px 10px;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .panel h1{font:22px/1.1 Georgia,"Times New Roman",serif;letter-spacing:-.02em;margin:0 0 4px}
  .panel .sum{font:10px/1.6 ui-monospace,Menlo,monospace;letter-spacing:.06em;color:var(--mute);margin:0 0 8px;white-space:pre-wrap}
  .acts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
  .acts button{font:10px ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;padding:8px 10px;border:1px solid #b8954f70;color:#535b4c;background:#fffefa;cursor:pointer}
  .acts button:hover{background:#f3ead6;border-color:#b8954f;color:#30372c}
  .acts button:disabled{opacity:.45;cursor:default}
  .acts button.bronze{border-color:#a7734d;color:#5a3a22}.acts button.gold{border-color:#b8954f;color:#6b5213}
  .hint{min-height:2.8em;color:#4c5246;margin:0 0 6px}.hint b{color:var(--ink)}
  .stats{font:10px/1.5 ui-monospace,Menlo,monospace;color:var(--mute);white-space:pre-wrap;border-top:1px solid var(--line);padding-top:6px}
  /* THE TANK: the balance under the pouch and the numbers that fly from its surface (his MMO DPS); moved by CSS on the compositor, written on a cause */
  .tank{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
  .tank[hidden]{display:none}
  .tank .balance{position:absolute;transform:translate(-50%,0);font:600 16px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.06em;color:#6b5213;text-align:center;white-space:nowrap}
  .tank .balance small{display:block;font-weight:400;font-size:10px;color:var(--mute);letter-spacing:.1em;margin-top:2px}
  .tank .balance.drop{animation:tank-drop .7s ease-out}
  @keyframes tank-drop{0%{color:#ff7a5c;transform:translate(-50%,0) scale(1.2)}100%{color:#6b5213;transform:translate(-50%,0) scale(1)}}
  .pop{position:absolute;transform:translate(-50%,-50%);font:800 clamp(18px,3.4vmin,42px)/1 "Helvetica Neue",Helvetica,Arial,sans-serif;color:#ffcf5c;
    -webkit-text-stroke:1px #4a2e05;text-shadow:0 2px 0 #4a2e05,0 0 16px #ffb347aa;white-space:nowrap;text-align:center;
    animation:pop-rise 1.8s cubic-bezier(.2,.9,.3,1) forwards;will-change:transform,opacity}
  .pop i{display:block;font:600 .4em/1.4 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:#fff3d6;-webkit-text-stroke:0;text-shadow:0 1px 0 #4a2e05,0 0 8px #4a2e0588;font-style:normal;margin-top:.2em}
  @keyframes pop-rise{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-85%) scale(1.3)}
    32%{transform:translate(-50%,-120%) scale(1)}100%{opacity:0;transform:translate(-50%,-300%) scale(.9)}}
</style>
</head>
<body>
<canvas id="glass" aria-label="The mint's Goldberg as a glass pouch filling with syrup: the MiniRouter tank. Drag to turn it."></canvas>
<div class="tank" id="tank" hidden aria-live="polite"><div id="pops"></div><div class="balance" id="balance"></div></div>
<aside class="panel">
  <h1>Syrup glass.</h1>
  <div class="sum" id="sum"></div>
  <div class="acts">
    <button type="button" class="bronze" id="bronze">Bronze drop</button>
    <button type="button" class="gold" id="gold">Gold drop</button>
    <button type="button" id="crowd">A crowd</button>
    <button type="button" id="expand">Expand</button>
    <button type="button" id="reset">Reset</button>
  </div>
  <p class="hint" id="hint" role="status"></p>
  <div class="stats" id="stats"></div>
</aside>
<script type="module">
import {createMint, HUES, mulberry} from './mint-gravity.mjs';
import {morphPlan} from './mint-sphere.js';
import {createTank, PURSE_REF, DROPS_REF, costText, tokensText, SPARKS, SIP} from './tank-law.mjs';

const $ = s => document.querySelector(s);
const q = new URLSearchParams(location.search);
const canvas = $('#glass');
const gl = canvas.getContext('webgl2', {antialias: true, alpha: false, depth: false, stencil: false, premultipliedAlpha: false, preserveDrawingBuffer: true, powerPreference: 'high-performance'});   // preserved: a frame repaints only the rectangle around the pouch
if (!gl) { $('#hint').textContent = 'This page needs WebGL2.'; throw new Error('no WebGL2'); }
const extF = gl.getExtension('EXT_color_buffer_float');
if (!extF) { $('#hint').textContent = 'This page needs EXT_color_buffer_float (the wave field is a float texture).'; throw new Error('no float render targets'); }
const extT = gl.getExtension('EXT_disjoint_timer_query_webgl2');
const dbg = gl.getExtension('WEBGL_debug_renderer_info');
const RENDERER = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);

// ---------- the numbers of the look ----------
// THE QUALITY (Oct 16 2026, his "consider this will have to run on very cheap phones"): 'full' is the look as benched on the Macs; 'lean' is the same
// look for a cheap glass: the sphere map at a quarter of the texels (512 x 256) stepped at 120 Hz instead of 240 (the wave's speed per texel and
// step is the same, so a ripple crosses the pouch at the same speed; its life in milliseconds is its own, measured: LIFE_MS), the backdrop
// read once a pixel in the glass pass (no chromatic fringe), the canvas at one device pixel per css pixel. ?quality=lean|full says; 'auto' (the
// default outside a bench) takes lean on a coarse pointer (a phone, a tablet) or four cores or fewer. A bench (?bench=1) is full unless told.
const QUALITY = (() => { const v = q.get('quality'); if (v === 'lean' || v === 'full') return v; if (q.has('bench') && q.get('bench') !== 'auto') return 'full';
  const cheap = (matchMedia?.('(pointer: coarse)')?.matches ?? false) || (navigator.hardwareConcurrency || 8) <= 4; return cheap ? 'lean' : 'full'; })();
const LEAN = QUALITY === 'lean';
const FW = LEAN ? 512 : 1024, FH = LEAN ? 256 : 512;   // the sphere map
const SUB_MS = LEAN ? 1000 / 120 : 1000 / 240;        // four wave steps a 60 Hz frame (two when lean): half a texel a step, two texels a frame
const WAVE = {k: 0.36, damp: 0.012, visc: 0.2, kick: 0.3, absorb: 0.5};   // k: c = 0.6 texel a step; visc: the velocity smoothed, short waves die first; k 0.40 with visc 0.2 explodes (the CPU replay, Oct 14)
const DROP = {bronze: {amp: 0.35, radius: 0.45, size: 0.034, depth: 0.18}, gold: {amp: 1.0, radius: 0.8, size: 0.058, depth: 1.0}, spark: {size: 0.013}};   // radius in cells; depth is the amber (the money); a spark is a call's
const REST = q.get('rest') === 'energy' ? 'energy' : 'time';   // how the pouch knows it is still: by the clock (LIFE_MS) or by the field's energy read back
const E_REST = Number(q.get('e_rest') || 0.03);   // the field's energy under which the pouch is still (REST 'energy')
// THE LIFE OF A RIPPLE (REST 'time', the default since Oct 16 2026). The wave is deterministic in its 240 Hz substeps, so a drop's ripple falls
// under E_REST the same number of steps after its splat on every machine. Measured once through the energy readback (a probe over window.__syrup,
// Oct 16 2026, this field, these WAVE constants, the readback every 12 frames): a gold drop is still 5,183 ms after its splat, a bronze 3,783 ms,
// twice the same to the millisecond; a later drop's life counts from its own splat. So the clock says when the field is still, and the energy
// pass (a 32 x 32 texel sum a pixel, 683 µs a call on NewMac's M4 Max, the costliest pass of the page) and its fence and readback never run.
// ?rest=energy keeps them, to measure LIFE_MS again when WAVE or the field changes.
// The lives, by quality (lean's are longer in milliseconds: half the steps a second, and the field's energy sum is a quarter, so E_REST is met at
// a smaller amplitude): measured through the readback on this tree, Oct 16 2026: full gold 5,183, bronze 3,783, a call's sip (SIP, tank-law.mjs)
// 3,600 ms; lean gold 7,983, bronze 5,583, sip 5,000 ms. Each rounded up to the next 200 ms, the readback's own cadence.
const LIFE_MS = LEAN ? {gold: 8000, bronze: 5600, sip: 5000} : {gold: 5200, bronze: 3800, sip: 3600};
let restAt = -Infinity;   // the clock at which the last drop's ripple has lived its life
const FALL_MS = 400, GLIDE_MS = 1600, SET_MS = 350, LEVEL_MS = 250, ENERGY_EVERY = 12;
const RIPPLE = Number(q.get('ripple') || 9), CAUSTIC = Number(q.get('caustic') || 90);
const DISPERSION = q.get('dispersion') === '0' || (LEAN && q.get('dispersion') !== '1') ? 0 : 1;   // the far cell's backdrop read three times (R, G and B a little apart: the chromatic fringe) or once (?dispersion=0, and lean: a third of that work in the glass pass)
const TANK = q.get('tank') === '1' || (!q.has('bench') && q.get('tank') !== '0');   // THE TANK: the purse read from the Nest; off in a bench unless asked, so a bench stays hermetic
const NEST = (q.get('nest') || `${location.protocol}//${location.hostname}:8904`).replace(/\/$/, '');
const tank = TANK ? createTank() : null;   // THE TANK's law (tank-law.mjs); its mount is at the end of this script
const CHAIR_DEPTH = 1.0, STAR_R = 0.34;

// ---------- shaders ----------
const COMMON = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
const float PI = 3.14159265358979;
vec2 equirect(vec3 d) { return vec2(atan(d.z, d.x) / (2.0 * PI) + 0.5, asin(clamp(d.y, -1.0, 1.0)) / PI + 0.5); }
vec3 dirOf(vec2 uv) { float lon = (uv.x - 0.5) * 2.0 * PI, lat = (uv.y - 0.5) * PI; float c = cos(lat); return vec3(c * cos(lon), sin(lat), c * sin(lon)); }
const vec3 SIGMA = vec3(0.35, 1.15, 3.3);
const vec3 KEY = vec3(-0.32, 0.7, 0.64);
vec3 env(vec3 d) {
  vec3 sky = mix(mix(vec3(0.30, 0.28, 0.25), vec3(0.74, 0.70, 0.63), smoothstep(-0.9, -0.1, d.y)), vec3(0.99, 0.985, 0.96), smoothstep(0.0, 0.7, d.y));
  float win = smoothstep(0.90, 0.985, dot(d, normalize(vec3(-0.45, 0.55, 0.70))));
  return sky + vec3(1.0, 0.98, 0.93) * win * 0.9;
}
`;
const QUAD_VS = `#version 300 es
out vec2 vUv;
void main() { vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); vUv = p; gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;

// (a) the wave: h_new = h + (h - h_before)(1 - damp) + k Laplacian(h); a tap into another pool is a wall
const WAVE_FS = COMMON + `
uniform sampler2D uField, uMask; uniform vec2 uTexel; uniform float uK, uDamp, uVisc, uKick, uAbsorb, uSplatAmp; uniform vec4 uSplat;
in vec2 vUv; out vec4 o;
void main() {
  vec2 uv = vUv; float lat = (uv.y - 0.5) * PI; float cl = max(cos(lat), 0.03125);
  vec2 dx = vec2(uTexel.x / cl, 0.0), dy = vec2(0.0, uTexel.y);
  vec2 c = texture(uField, uv).rg; float h = c.r, hp = c.g;
  float pool = texture(uMask, uv).r; vec2 wall = c * (1.0 - uAbsorb);
  vec2 l = texture(uMask, uv - dx).r == pool ? texture(uField, uv - dx).rg : wall;
  vec2 r = texture(uMask, uv + dx).r == pool ? texture(uField, uv + dx).rg : wall;
  vec2 d = texture(uMask, uv - dy).r == pool ? texture(uField, uv - dy).rg : wall;
  vec2 up = texture(uMask, uv + dy).r == pool ? texture(uField, uv + dy).rg : wall;
  vec2 lap2 = l + r + d + up - 4.0 * c;          // .x the Laplacian of h, .y of h before
  float lap = lap2.x, lapV = lap2.x - lap2.y;     // the Laplacian of the velocity
  float v = (h - hp) + 0.25 * uVisc * lapV;       // the velocity as a convex mix with its neighbours': the syrup's viscosity, short waves die first
  float hn = h + v * (1.0 - uDamp) + uK * lap;
  float before = h;
  if (uSplatAmp != 0.0) {                         // the drop: a dip, and the displaced syrup risen in a rim twice as wide, so the splat moves no volume
    float a = acos(clamp(dot(dirOf(uv), uSplat.xyz), -1.0, 1.0)), R = uSplat.w;
    if (a < 2.0 * R) { float w = (a < R ? 0.5 + 0.5 * cos(PI * a / R) : 0.0) - 0.25 * (0.5 + 0.5 * cos(PI * a / (2.0 * R))); hn -= uSplatAmp * w; before -= uSplatAmp * w * (1.0 - uKick); }
  }
  o = vec4(hn, before, 0.0, 0.0);
}`;
// the field's energy, 32 x 32 texels a sum
const ENERGY_FS = COMMON + `
uniform sampler2D uField; in vec2 vUv; out vec4 o;
void main() { ivec2 b = ivec2(gl_FragCoord.xy) * 32; float e = 0.0;
  for (int j = 0; j < 32; j++) for (int i = 0; i < 32; i++) { vec2 c = texelFetch(uField, b + ivec2(i, j), 0).rg; float v = c.r - c.g; e += c.r * c.r + 4.0 * v * v; }
  o = vec4(e, 0.0, 0.0, 1.0); }`;
// the pools: every texel of the sphere map takes the nearest face centre; a face's pool is its home mass
const MASK_FS = COMMON + `
uniform sampler2D uCenters; uniform int uFaces; uniform float uInside; in vec2 vUv; out vec4 o;
void main() { vec3 d = dirOf(vUv); float best = -2.0; int bi = 0;
  for (int i = 0; i < 1024; i++) { if (i >= uFaces) break; vec4 c = texelFetch(uCenters, ivec2(i, 0), 0); float t = dot(d, c.xyz); if (t > best) { best = t; bi = i; if (t > uInside) break; } }
  o = vec4(texelFetch(uCenters, ivec2(bi, 0), 0).w, float(bi), 0.0, 0.0); }`;
// (c) the parchment, the pouch's shadow and the caustics under it: a function of the pixel, evaluated by the parchment pass
// at its own pixel and by the glass and the drops at the pixel their refraction lands on (no backdrop texture, no copy pass)
const BACKDROP = `
uniform sampler2D uField, uMask, uFaceData; uniform vec2 uRes, uTexel; uniform vec3 uSphere; uniform mat3 uRotInv; uniform float uLevel, uTime, uCaustic;
float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
float lapAt(vec2 uv) { float lat = (uv.y - 0.5) * PI; float cl = max(cos(lat), 0.03125); vec2 dx = vec2(2.0 * uTexel.x / cl, 0.0), dy = vec2(0.0, 2.0 * uTexel.y);
  float h = texture(uField, uv).r, pool = texture(uMask, uv).r;
  float hl = texture(uMask, uv - dx).r == pool ? texture(uField, uv - dx).r : h, hr = texture(uMask, uv + dx).r == pool ? texture(uField, uv + dx).r : h;
  float hd = texture(uMask, uv - dy).r == pool ? texture(uField, uv - dy).r : h, hu = texture(uMask, uv + dy).r == pool ? texture(uField, uv + dy).r : h;
  return hl + hr + hd + hu - 4.0 * h; }
vec3 backdrop(vec2 px) {
  vec3 paper = vec3(0.957, 0.941, 0.906);
  float grain = (hash(floor(px)) - 0.5) * 0.035;
  vec2 cc = (px - uRes * 0.5) / uRes.y; float vig = 1.0 - 0.3 * dot(cc, cc);
  vec3 col = paper * (vig + grain);
  vec2 sc = vec2(uSphere.x, uSphere.y - uSphere.z * 1.15);
  vec2 e = (px - sc) / (uSphere.z * vec2(1.25, 0.17));
  float rho2 = dot(e, e);
  float shadow = smoothstep(1.0, 0.2, rho2);
  col *= 1.0 - 0.24 * shadow;
  if (rho2 < 1.0) {
    vec3 dw = vec3(e.x, -sqrt(1.0 - rho2), -e.y);
    vec3 dm = uRotInv * dw; vec2 uv = equirect(dm);
    float face = texture(uMask, uv).g; vec4 fd = texelFetch(uFaceData, ivec2(int(face + 0.5), 0), 0);
    float depth = max(fd.r, 0.0) * smoothstep(fd.a, fd.a + 350.0, uTime);
    float lap = lapAt(uv);
    float focus = exp(-rho2 * 2.4) * 0.8 + 0.25 * smoothstep(0.1, 0.0, abs(rho2 - 0.5));
    float pool = max(0.0, uLevel - dw.y);
    vec3 T = exp(-SIGMA * depth * 1.3) * exp(-SIGMA * 0.55 * pool);
    float ripple = clamp(1.0 - uCaustic * lap, 0.0, 3.0);
    col += vec3(1.0, 0.93, 0.78) * focus * T * ripple * 0.26 * smoothstep(1.0, 0.6, rho2);
  }
  return col;
}
`;
const BACK_FS = COMMON + BACKDROP + `
out vec4 o;
void main() { o = vec4(backdrop(gl_FragCoord.xy), 1.0); }`;
// (b) the glass
const GLASS_VS = `#version 300 es
precision highp float;
layout(location=0) in vec3 aA; layout(location=1) in vec3 aB; layout(location=2) in vec3 aNA; layout(location=3) in vec3 aNB; layout(location=4) in float aFace; layout(location=5) in float aEdge;
uniform mat3 uRot; uniform mat4 uVP; uniform float uProgress, uOffset;
out vec3 vPos; out vec3 vN; out vec3 vModel; flat out float vFace; out float vEdge;
void main() { vec3 pm = mix(aA, aB, uProgress); vec3 nm = normalize(mix(aNA, aNB, uProgress));
  vModel = pm; vPos = uRot * pm; vN = uRot * nm; vFace = aFace; vEdge = aEdge;
  gl_Position = uVP * vec4(vPos, 1.0); gl_Position.x += uOffset * gl_Position.w; }`;
const GLASS_FS = COMMON + BACKDROP + `
uniform sampler2D uStar; uniform mat3 uRot; uniform mat4 uVP; uniform vec3 uEye;
uniform float uRipple, uOffset, uStarR, uHasStar, uDispersion;
in vec3 vPos; in vec3 vN; in vec3 vModel; flat in float vFace; in float vEdge; out vec4 o;
vec3 unpackHue(float h) { float r = floor(h / 65536.0), g = floor((h - r * 65536.0) / 256.0), b = h - r * 65536.0 - g * 256.0; return vec3(r, g, b) / 255.0; }

  resetStats: () => { passStats = {}; frames = 0; draws = 0; },
  /** the field read back whole (8 MB, a stall): the largest |h| and its texel, the energy by the same sum; for a probe only */
  fieldRead: () => { const out = new Float32Array(FW * FH * 4); gl.bindFramebuffer(gl.FRAMEBUFFER, fieldFbo[cur]); gl.readPixels(0, 0, FW, FH, gl.RGBA, gl.FLOAT, out); gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    let m = 0, at = -1, e = 0, nan = 0; for (let i = 0; i < FW * FH; i++) { const h = out[i * 4], v = h - out[i * 4 + 1]; if (h !== h) { nan++; continue; } if (Math.abs(h) > m) { m = Math.abs(h); at = i; } e += h * h + 4 * v * v; }
    return {max: m, at: at < 0 ? null : {x: at % FW, y: Math.floor(at / FW), lat: ((Math.floor(at / FW) + 0.5) / FH - 0.5) * 180}, energy: e, nan}; },
  /** `n` frames with ripples alive: a bronze drop every 24 frames; returns the pass times and the frame deltas */
  benchAlive: n => new Promise(resolve => { passStats = {}; const deltas = [], cpu = []; let count = 0, last = null; const d0 = draws;
    const go = ts => { if (last != null) deltas.push(ts - last); last = ts; if (count % 24 === 0) buy('bronze'); if (count % 96 === 48) buy('gold'); wake();
      cpu.push(lastDrawCpu); if (++count < n) requestAnimationFrame(go); else { const dEnd = draws - d0; const look = () => { pollQueries(); if (pending.length) return setTimeout(look, 100); resolve({frames: n, draws: dEnd, deltas, cpu, passes: window.__syrup.stats().passes}); }; setTimeout(look, 150); } };
    requestAnimationFrame(go); }),
  /** waits for rest, then counts `n` frames of its own and the page's draws in them: zero is the law */
  benchRest: n => new Promise(resolve => { const start = () => { const d0 = draws, f0 = frames; let count = 0; const go = () => { if (++count < n) requestAnimationFrame(go); else resolve({frames: n, draws: draws - d0, pageFrames: frames - f0, energy, rippling, syncReads, animating: animating()}); }; requestAnimationFrame(go); };
    if (!animating() && !frame) start(); else { restWaiters.push(start); wake(); } }),
  /** each pass alone, `n` times between two finishes: the wall clock a pass costs when no GPU timer answers */
  benchPasses: (n = 60) => { const out = {}; const run = (name, fn) => { gl.finish(); const t0 = performance.now(); for (let i = 0; i < n; i++) fn(); gl.finish(); out[name] = (performance.now() - t0) / n * 1000; };
    const was = rippling; rippling = true; run('wave x4', () => { for (let i = 0; i < 4; i++) waveStep(null); }); run('energy', () => energyIssue(true)); run('mask', () => buildMask()); rippling = was;
    run('frame (back+glass+beads)', () => draw()); return out; },
};

// ---------- THE BENCH ON THE GLASS ITSELF (?bench=auto; Oct 16 2026, his "can you start benchmarking it on lysa", "very cheap phones") ----------
// A phone, a tablet or lysa's kiosk has no DevTools road for the Mac's bench (syrup-glass.bench.mjs): opened with ?bench=auto the page benches
// itself as that bench does (two rungs of land, 240 frames alive with a drop every 24, 120 at rest, each pass alone) and says the receipt on
// its panel, in its title (a picture of the glass carries it) and on the console (one line, 'syrup-bench {...}'); window.__syrup.receipt holds
// it; ?report=<url> posts it there by sendBeacon (nothing leaves otherwise). The tank is off in a bench unless ?tank=1. Nothing repeats.
if (q.get('bench') === 'auto') {
  (async () => {
    await ready; await new Promise(r => setTimeout(r, 300));
    const S = window.__syrup;
    S.expand(); S.advance(1700); S.expand(); S.advance(1700); S.draw();
    const alive = await S.benchAlive(240), rest = await S.benchRest(120), alone = S.benchPasses(30);
    const st = v => { const s = [...v].sort((a, b) => a - b), at = p => s[Math.min(s.length - 1, Math.floor(p * s.length))]; return s.length ? {median: at(0.5), p95: at(0.95), max: s[s.length - 1]} : null; };
    const receipt = {at: new Date().toISOString(), ua: navigator.userAgent, renderer: RENDERER, timer: Boolean(extT), size: [W, H], dpr, cores: navigator.hardwareConcurrency || null,
      quality: QUALITY, field: [FW, FH], stepsPerSecond: Math.round(1000 / SUB_MS), rest: REST, dispersion: DISPERSION,
      alive: {frames: alive.frames, draws: alive.draws, delta_ms: st(alive.deltas), draw_cpu_ms: st(alive.cpu), gpu_us: alive.passes}, atRest: {frames: rest.frames, draws: rest.draws}, alone_us: alone};
    window.__syrup.receipt = receipt; console.log('syrup-bench ' + JSON.stringify(receipt));
    const gpu = extT ? 'GPU ' + Object.entries(alive.passes).map(([k, v]) => `${k} ${v.us.toFixed(0)}µs`).join(' ') : 'no GPU timer';
    const line = `BENCH ${QUALITY} ${W}×${H}@${dpr} · alive ${receipt.alive.delta_ms.median.toFixed(1)} ms median, p95 ${receipt.alive.delta_ms.p95.toFixed(1)} · rest ${rest.draws} draws in ${rest.frames} · ${gpu} · alone ${Object.entries(alone).map(([k, v]) => `${k} ${v.toFixed(0)}µs`).join(' ')}`;
    say(`<b>Bench done.</b> ${escapeHtml(line)}`); document.title = line;
    const report = q.get('report'); if (report) { try { navigator.sendBeacon(report, JSON.stringify(receipt)); } catch { /* the receipt stays on the page */ } }
  })().catch(e => say(`<b>Bench failed.</b> ${escapeHtml(String(e && e.message || e))}`));
}
</script>
