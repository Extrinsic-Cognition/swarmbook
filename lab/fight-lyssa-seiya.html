    return Math.sign(b.x - a.x || 1) * Math.sign(dxScreen || 1) > 0 ? 1 : -1; };   // his local +x (the side step 03.30) is the way his drag went on this glass
  addEventListener('keydown', (e) => {
    if (PROTECT) { if (e.key === ' ') { e.preventDefault(); press('meteor'); } else if (e.key === 'p' || e.key === 'Enter' || e.key === 'ArrowUp') press('punch'); else if (e.key === 'ArrowDown') press('back'); else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') press('step', stepDir(e.key === 'ArrowRight' ? 1 : -1)); return; }
    if (e.key >= '1' && e.key <= '3') { lever = Number(e.key) - 1; $('lever').textContent = e.key; } else if (e.key === ' ') { e.preventDefault(); cast({ cast: 'lift' }); } });
  canvas.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY }; });
  canvas.addEventListener('pointerup', (e) => { if (!down) return; const dx = e.clientX - down.x, dy = e.clientY - down.y; down = null;
    if (PROTECT) { if (Math.hypot(dx, dy) <= 30) press('meteor'); else if (-dy > Math.abs(dx)) press('punch'); else if (dy > Math.abs(dx)) press('back'); else press('step', stepDir(dx)); return; }
    if (Math.hypot(dx, dy) > 30) cast({ lever, cast: 'drag', dir: dx < 0 ? -1 : 1 }); else cast({ lever, cast: 'tap' }); });

  // ---- the proof's door (window.FIGHT): read the plan, draw an instant, make a contact sheet of instants ----
  window.FIGHT = {
    get plan() { return P; }, get frames() { return frames; }, get playing() { return playing; }, error: null,
    events: () => P.events.map((e) => ({ ...e, w: F.wallOf(P, e.g) })), freezes: () => P.freezes.map((f) => ({ ...f })), end: () => ({ ...P.end, wall_ms: P.wall_ms }),
    draw: (w) => { pause(); lastW = w; const st = draw(w); return { g: st.g, w: st.w, freeze: !!st.freeze, hp: st.hp, rank: st.rank, seiya: { x: st.seiya.x, z: st.seiya.z, clip: st.seiya.clip, mode: st.seiya.mode }, her: { p: st.her.p, scale: st.her.scale, gold: st.her.gold }, harley: st.harley ? { hp: st.harley.hp, struck: st.harley.struck, taken: st.harley.taken } : null, end: st.end }; },
    mode: PROTECT ? 'harleyquintiti' : 'lab', get fight() { return fight; }, get mismatch() { return mismatch; }, digest: () => digestOf(P), press,
    play, pause,
    replanMs: () => { const a = performance.now(), Q = planNow(), ms = performance.now() - a; return { ms, same: JSON.stringify(Q.events) === JSON.stringify(P.events) }; },
    sheet: (cells, { cols = 4, cw = 480, ch = 270 } = {}) => {
      pause(); const rows = Math.ceil(cells.length / cols), out = document.createElement('canvas'); out.width = cols * cw; out.height = rows * ch + 34; const x = out.getContext('2d');
      x.fillStyle = '#0a0c12'; x.fillRect(0, 0, out.width, out.height); x.font = '600 15px ui-sans-serif, system-ui, sans-serif'; x.fillStyle = '#d9b45a';
      x.fillText(`${PROTECT ? 'Seiya for Harleyquintiti against the Lyssajudron · lab/fight-lyssa-seiya.html?for=harleyquintiti' : 'Lyssajudron against Seiya in the Pegasus Cloth · lab/fight-lyssa-seiya.html'} · ${cells.length} instants of one fight from fixed causes`, 12, 22);
      cells.forEach((cell, i) => {
        draw(cell.w); const cx = (i % cols) * cw, cy = 34 + Math.floor(i / cols) * ch;
        x.drawImage(canvas, 0, 0, canvas.width, canvas.height, cx, cy, cw, ch);
        x.fillStyle = 'rgba(10,12,18,.72)'; x.fillRect(cx, cy + ch - 40, cw, 40); x.fillStyle = '#f2ead8'; x.font = '600 13px ui-sans-serif, system-ui, sans-serif';
        x.fillText(cell.label.slice(0, 64), cx + 8, cy + ch - 23); x.font = '12px ui-monospace, Menlo, monospace'; x.fillStyle = '#c9b98f'; x.fillText((cell.sub || '').slice(0, 72), cx + 8, cy + ch - 8);
        x.strokeStyle = '#000'; x.strokeRect(cx + 0.5, cy + 0.5, cw - 1, ch - 1);
      });
      return out.toDataURL('image/png');
    },
    ready: true,
  };
  const at = params.get('at');
  if (at !== null) { lastW = Number(at) || 0; draw(lastW); }
  else { draw(0); if (params.get('play') !== '0') play(); }
  if (NEST && at === null) {   // the Nest's fight: read it once, follow it on the stream, and set the house clock by two trips and the stream's beats
    const trip = async () => { try { const a = Date.now(), j = await fetch(`${NEST}/nest/head`, { cache: 'no-store' }).then((r) => r.json()), b = Date.now(); if (Number.isFinite(j.server_ms)) clock.trip(j.server_ms, a, b); } catch {} };
    await trip(); await trip();
    fetch(`${NEST}/nest/ref/${REF}`, { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).then((j) => { if (j?.ref?.value && houseNow() - j.ref.value.t0 < 10 * 60000) takeFight(j.ref.value); }).catch(() => {});
    const es = new EventSource(`${NEST}/nest/stream?types=ref&refs=${encodeURIComponent(REF)}`);
    es.onmessage = (m) => { try { const e = JSON.parse(m.data); if (e && e.type === 'ref' && e.payload && e.payload.name === REF) { takeFight(e.payload.value); earAgain(e.payload.value); } } catch {} };
    es.addEventListener('beat', (m) => { try { clock.beat(JSON.parse(m.data), Date.now()); } catch {} });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { trip(); if (fight) { playing = false; play(); } } });
  }
} catch (e) { say(e); }
</script>
