<svg xmlns="http://www.w3.org/2000/svg" width="440" height="440" viewBox="0 0 440 440" role="img" aria-labelledby="title desc">
  <title id="title">Energy saver mode on</title>
  <desc id="desc">A hand-carved wooden notice hangs from two ropes. A laurel seal reads SPQR; the notice reads Energy Saver, Mode On, the forum can wait.</desc>
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9A369"/>
      <stop offset=".46" stop-color="#BB9258"/>
      <stop offset="1" stop-color="#AA7C45"/>
    </linearGradient>
    <linearGradient id="lower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6A06A"/>
      <stop offset="1" stop-color="#B08651"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="2.6" flood-color="#2B2620" flood-opacity=".12"/>
    </filter>
    <clipPath id="grainClip">
      <path d="M75 164H356V172H368V257H358V273H86V264H73V181H75Z"/>
      <path d="M104 281H339V288H350V329H339V338H107V330H95V292H104Z"/>
    </clipPath>
  </defs>

  <!-- Quiet, drawn hardware: two little brass wall pegs, with twined hemp. -->
  <g stroke="#6A5137" stroke-linecap="round" stroke-linejoin="round">
    <path d="M128 86C127 115 130 143 140 177M311 86C313 114 307 143 301 177" fill="none" stroke="#2B2620" stroke-opacity=".09" stroke-width="8" transform="translate(2 2)"/>
    <path d="M128 86C127 115 130 143 140 177M311 86C313 114 307 143 301 177" fill="none" stroke="#927446" stroke-width="5"/>
    <path d="M127 87C127 113 130 140 139 174M310 87C312 114 307 142 300 174" fill="none" stroke="#D5B981" stroke-width="1.7"/>
    <path d="m126 102 5 3m-5 7 5 3m-4 7 5 3m-4 7 6 3m-3 7 5 2m-2 8 5 2m166-50 5 3m-5 7 5 3m-6 7 5 3m-7 7 5 3m-7 7 5 3m-7 7 5 3" fill="none" stroke="#6F5734" stroke-width="1" opacity=".62"/>
    <circle cx="128" cy="83" r="7" fill="#9A793F" stroke-width="1.5"/>
    <circle cx="311" cy="83" r="7" fill="#9A793F" stroke-width="1.5"/>
    <path d="m126 82 4 2m-2-4-1 5m182-3 4 2m-2-4-1 5" stroke="#E3C995" stroke-width="1.2"/>
  </g>

  <g transform="rotate(-2.4 220 227)" filter="url(#shadow)">
    <!-- Joinery is visible between the two planks. -->
    <path d="M129 244H149V310H129ZM294 244H312V310H294Z" fill="#6F5031" stroke="#523C28" stroke-width="2"/>
    <path d="M134 259V305M299 259V305" stroke="#BD945A" stroke-width="2"/>

    <!-- A stepped, bevelled silhouette makes this a game prop. -->
    <path d="M77 170H358V178H370V263H360V279H88V270H75V187H77Z" fill="#725033" stroke="#533E2B" stroke-width="2" stroke-linejoin="round"/>
    <path d="M75 164H356V172H368V257H358V273H86V264H73V181H75Z" fill="url(#wood)" stroke="#60472F" stroke-width="2" stroke-linejoin="round"/>
    <path d="M78 166H354V175H364M76 184V260H88V269H352" fill="none" stroke="#E2BD81" stroke-width="3" stroke-linejoin="round"/>
    <path d="M362 178V254H354V269M91 269H351" fill="none" stroke="#8B623A" stroke-width="3"/>

    <path d="M106 287H341V294H352V335H341V344H109V336H97V298H106Z" fill="#755434" stroke="#533E2B" stroke-width="2" stroke-linejoin="round"/>
    <path d="M104 281H339V288H350V329H339V338H107V330H95V292H104Z" fill="url(#lower)" stroke="#60472F" stroke-width="2" stroke-linejoin="round"/>
    <path d="M108 284H336V291H346M99 294V327H111V334H334" fill="none" stroke="#DEBA82" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M345 296V326H335V334" fill="none" stroke="#8B623A" stroke-width="2.5"/>

    <!-- Wood grain is deliberately sparse, cut around the inscriptions. -->
    <g clip-path="url(#grainClip)" fill="none" stroke="#765233" stroke-linecap="round" opacity=".34">
      <path d="M82 187C125 184 129 188 164 184M273 184C306 185 326 180 355 184M79 247C101 252 109 246 119 248M322 248C339 244 350 249 364 244M84 258C115 261 135 257 153 260M281 260C310 261 331 256 354 259"/>
      <path d="M97 174C111 179 118 175 129 177M318 171C329 173 337 171 348 174M86 219C96 218 103 220 112 218M330 216C342 220 353 213 364 216"/>
      <path d="M104 299C116 300 124 297 137 298M306 299C320 301 331 297 342 300M114 328C128 326 137 330 149 328M287 329C309 326 321 329 334 326"/>
      <path d="M87 233C95 226 106 228 108 233S96 241 87 233Zm6 0c4-2 8-1 9 0s-5 2-9 0M330 196c8-7 19-5 22 0s-12 8-22 0Zm7 0c4-2 8-1 9 0s-5 2-9 0" stroke-width=".9"/>
      <path d="m74 196 13-2 10 2m271 38-13-1-6 3m-205 45-4 8 2 7m192 41-4-7 2-5" stroke-width="1.4"/>
    </g>

    <!-- Brass tacks, with irregular little chisel marks. -->
    <g fill="#534431" stroke="#3B3024" stroke-width="1">
      <circle cx="93" cy="185" r="3.5"/><circle cx="347" cy="185" r="3.5"/>
      <circle cx="93" cy="251" r="3.5"/><circle cx="347" cy="251" r="3.5"/>
      <circle cx="114" cy="311" r="3"/><circle cx="330" cy="311" r="3"/>
    </g>
    <g stroke="#D0B184" stroke-width="1.2" stroke-linecap="round">
      <path d="m91 183 3 1m251-1 3 1M91 249l3 1m251-1 3 1m-236 60 3 1m213-1 3 1"/>
    </g>

    <!-- A small laurel seal is part of the object, not a UI badge. -->
    <path d="M201 156L207 148H231L239 156V181L231 188H208L201 180Z" fill="#816037" stroke="#5F462B" stroke-width="1.4"/>
    <path d="M199 152L207 145H231L237 152V177L230 184H207L199 177Z" fill="#BC914C" stroke="#6F5131" stroke-width="1.5"/>
    <path d="M203 155V174L209 180H228L233 174V155" fill="none" stroke="#DABA76" stroke-width="1.5"/>
    <g fill="none" stroke="#684B2A" stroke-width="1.1" stroke-linecap="round">
      <path d="M211 174C203 170 204 160 209 155M226 174C234 170 233 160 229 155"/>
      <path d="m207 169-3-1m3-2-2-3m3 0-1-4m23 10 3-1m-3-2 2-3m-3 0 1-4"/>
    </g>
    <text x="218" y="167" text-anchor="middle" font-family="Georgia, serif" font-size="8" font-weight="700" letter-spacing=".6" fill="#4C3924">SPQR</text>

    <!-- Restrained highlights suggest lettering carved into the boards. -->
    <g text-anchor="middle" font-family="Georgia, serif" font-weight="700">
      <text x="221" y="217" fill="#E0B97D" font-size="25" letter-spacing="1.1">ENERGY SAVER</text>
      <text x="220" y="215.6" fill="#392D21" font-size="25" letter-spacing="1.1">ENERGY SAVER</text>
      <text x="221" y="248" fill="#E0B97D" font-size="25" letter-spacing="3">MODE ON</text>
      <text x="220" y="246.6" fill="#392D21" font-size="25" letter-spacing="3">MODE ON</text>
    </g>
    <path d="M151 313h13m115 0h13" fill="none" stroke="#785432" stroke-width="1"/>
    <text x="222" y="317" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#4C3826">the forum can wait.</text>
  </g>

  <!-- One resting olive sprig, as quiet as the forum. -->
  <g transform="translate(318 365) rotate(-19)" stroke="#66734B" stroke-linecap="round">
    <path d="M-24 4Q-2 7 24-8" fill="none" stroke-width="1.6"/>
    <path d="M-14 5Q-14-5-24-7Q-24 2-14 5M-5 3Q-2-8-12-12Q-16-3-5 3M5 0Q13 8 22 1Q15-5 5 0M13-4Q18-13 11-19Q5-11 13-4" fill="#839167" stroke-width=".6"/>
  </g>
</svg>
